<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaybchess Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="track.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1e2429;color:#e8eaed;font-family:'Segoe UI',Arial,sans-serif;padding:16px;max-width:560px;margin:0 auto;}
h1{font-size:22px;margin-bottom:14px;}
.muted{color:#8fa3b1;}
.gate{text-align:center;padding:60px 20px;}
.gate .big{font-size:40px;margin-bottom:12px;}
.cards{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat{flex:1;min-width:140px;background:#252d35;border-radius:14px;padding:16px;}
.stat .lbl{font-size:12px;color:#8fa3b1;text-transform:uppercase;letter-spacing:.05em;}
.stat .val{font-size:28px;font-weight:800;margin-top:4px;}
.sec{font-size:15px;font-weight:700;margin:16px 0 8px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-row .nm{width:90px;font-size:13px;}
.bar-wrap{flex:1;background:#2e3a44;border-radius:6px;overflow:hidden;height:22px;}
.bar{height:100%;background:#81b64c;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:#102014;min-width:24px;}
.usr{background:#252d35;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.usr .info{flex:1;min-width:0;}
.usr .nm{font-weight:700;}
.usr .meta{font-size:12px;color:#8fa3b1;margin-top:2px;}
.usr .pbtn{border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap;}
.pbtn.on{background:#81b64c;color:#102014;}
.pbtn.off{background:#3a454e;color:#cfd8dc;}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a454e;background:#1a2025;color:#e8eaed;margin-bottom:10px;font-size:14px;}
.empty{color:#8fa3b1;text-align:center;padding:20px;}
</style>
</head>
<body>
<div id="app"><div class="empty">Yuklanmoqda...</div></div>

<script>
// O'z Telegram numeric ID'ngizni shu yerga qo'shing (masalan @userinfobot orqali oling).
const ADMIN_IDS = [8264870741];

const tg = window.Telegram && window.Telegram.WebApp;
try{ tg && tg.ready(); tg && tg.expand(); }catch(e){}
const me = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
const myId = me && me.id;

function db(){
  if(typeof firebase==='undefined') return null;
  if(!firebase.apps || !firebase.apps.length){
    firebase.initializeApp({
      apiKey:"AIzaSyBIrGRKHuQWlEbZPyqxsvl1dOZfmlbAd-A",
      databaseURL:"https://chess-game-aba31-default-rtdb.firebaseio.com",
      projectId:"chess-game-aba31"
    });
  }
  return firebase.database();
}

function gate(msg){
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="big">🔒</div><div>Ruxsat yo\'q</div>'+
    '<div class="muted" style="margin-top:8px;font-size:13px;">'+(msg||'')+'</div></div>';
}

function isAdmin(){
  if(!ADMIN_IDS.length) return true; // placeholder: ID qo'shilmaguncha ochiq (faqat dev uchun)
  return myId && ADMIN_IDS.indexOf(Number(myId))>=0;
}

function fmtDate(ts){
  if(!ts) return '—';
  const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+
    ' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

let USERS=[];

function render(){
  const total=USERS.length;
  const games={chess:0,checkers:0,puzzles:0,home:0};
  let premiumCount=0;
  USERS.forEach(u=>{
    if(u.premium) premiumCount++;
    const us=u.usage||{};
    ['chess','checkers','puzzles','home'].forEach(g=>games[g]+=(us[g]||0));
  });
  const maxG=Math.max(1,games.chess,games.checkers,games.puzzles,games.home);
  const labels={chess:'Shaxmat',checkers:'Shashka',puzzles:'Mashqlar',home:'Bosh sahifa'};

  let html='<h1>Vaybchess Admin</h1>';
  html+='<div class="cards">'+
    '<div class="stat"><div class="lbl">Foydalanuvchilar</div><div class="val">'+total+'</div></div>'+
    '<div class="stat"><div class="lbl">Premium</div><div class="val">'+premiumCount+'</div></div></div>';

  html+='<div class="sec">Qaysi o\'yin ko\'p ishlatiladi</div>';
  ['chess','checkers','puzzles','home'].forEach(g=>{
    const w=Math.round(games[g]/maxG*100);
    html+='<div class="bar-row"><div class="nm">'+labels[g]+'</div>'+
      '<div class="bar-wrap"><div class="bar" style="width:'+Math.max(w,4)+'%">'+games[g]+'</div></div></div>';
  });

  html+='<div class="sec">Foydalanuvchilar</div>';
  html+='<input class="search" id="q" placeholder="Ism yoki ID bo\'yicha qidirish..." oninput="filter(this.value)">';
  html+='<div id="list"></div>';
  document.getElementById('app').innerHTML=html;
  renderList('');
}

function renderList(q){
  q=(q||'').toLowerCase();
  const sorted=USERS.slice().sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  const rows=sorted.filter(u=>{
    if(!q) return true;
    return (u.name||'').toLowerCase().indexOf(q)>=0 ||
           (u.username||'').toLowerCase().indexOf(q)>=0 ||
           String(u.id).indexOf(q)>=0;
  });
  if(!rows.length){ document.getElementById('list').innerHTML='<div class="empty">Topilmadi</div>'; return; }
  let html='';
  rows.forEach(u=>{
    const us=u.usage||{};
    const usageStr='♟'+(us.puzzles||0)+' · ♞'+(us.chess||0)+' · ⬤'+(us.checkers||0);
    const uname=u.username?(' @'+u.username):'';
    html+='<div class="usr"><div class="info">'+
      '<div class="nm">'+(u.name||'—')+uname+'</div>'+
      '<div class="meta">ID '+u.id+' · '+fmtDate(u.lastSeen)+' · '+usageStr+'</div></div>'+
      '<button class="pbtn '+(u.premium?'on':'off')+'" onclick="togglePremium(\''+u.id+'\','+(u.premium?'true':'false')+')">'+
      (u.premium?'⭐ Premium':'Premium ber')+'</button></div>';
  });
  document.getElementById('list').innerHTML=html;
}

function filter(v){ renderList(v); }

function togglePremium(id, cur){
  const next=!cur;
  const d=db(); if(!d) return;
  d.ref('users/'+id+'/premium').set(next).then(function(){
    const u=USERS.find(x=>String(x.id)===String(id));
    if(u) u.premium=next;
    const q=document.getElementById('q');
    render();
    if(q) { document.getElementById('q').value=q.value; renderList(q.value); }
  });
}

function load(){
  if(!isAdmin()){ gate('Bu sahifa faqat admin uchun.'); return; }
  const d=db();
  if(!d){ gate('Firebase ulanmadi.'); return; }
  d.ref('users').once('value', function(snap){
    USERS=[];
    snap.forEach(function(ch){
      const v=ch.val()||{};
      v.id=v.id||ch.key;
      USERS.push(v);
    });
    render();
  }, function(err){ gate('O\'qishda xato: '+err.message); });
}

load();
</script>
</body>
</html>
